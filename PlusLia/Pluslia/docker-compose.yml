services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pluslia_app
    container_name: example_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage
      - public_data:/var/www/public
    networks:
      - laravel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: pluslia_app
    container_name: example_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage
      - public_data:/var/www/public
    networks:
      - laravel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  reverb:
    image: pluslia_app
    container_name: example_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage
      - public_data:/var/www/public
    ports:
      - "6001:6001"
    networks:
      - laravel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]

  nginx:
    image: nginx:alpine
    container_name: example_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - public_data:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: example_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: example_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: example_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  storage_data:
  public_data:
  postgres_data:
